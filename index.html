<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ali Haider — Data Analytics · Machine Learning · NLP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFA;
    --ink: #111111;
    --secondary: #6B7280;
    --line: #D1D5DB;
    --accent: #5B7C99;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.08em;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 44px);
    margin: 0 0 8px 0;
    letter-spacing: -0.01em;
  }
  .tagline {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 32px 0;
  }
  .claim {
    max-width: 520px;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    font-style: italic;
    margin: 0 0 40px 0;
  }
  .status {
    font-size: 13px;
    color: var(--secondary);
    border-top: 1px solid var(--line);
    padding-top: 16px;
    max-width: 320px;
  }
</style>
</head>
<body>

  <div class="mark">AH</div>
  <h1>Ali Haider</h1>
  <p class="tagline">NLP &middot; Data Analytics &middot; Machine Learning</p>
  <p class="claim">&ldquo;I don&rsquo;t guess what your data means &mdash; I test it until I find what it&rsquo;s hiding.&rdquo;</p>
  <p class="status">Portfolio in progress. Case studies and full site launching soon.</p>

</body>
</html>
